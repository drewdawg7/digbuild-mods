name: publish-mods

# Triggered by the in-JVM agent on the game server: it fingerprints mods/ on its
# own 15-min timer and fires repository_dispatch only when something changed.
# No polling here. workflow_dispatch stays for manual runs.
on:
  repository_dispatch:
    types: [mods-changed]
  workflow_dispatch: {}

concurrency:
  group: publish-mods
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keeps the previous 466MB mirror around so only changed jars transfer.
      - name: Restore mod mirror
        uses: actions/cache/restore@v4
        with:
          path: mods
          key: mods-${{ hashFiles('manifest.json') }}
          restore-keys: mods-

      - name: Sync from game server
        id: sync
        env:
          PTERO_PANEL: ${{ vars.PTERO_PANEL }}
          PTERO_SERVER: ${{ vars.PTERO_SERVER }}
          PTERO_KEY: ${{ secrets.PTERO_KEY }}
        run: python3 scripts/sync_mods.py

      - name: Stop here if nothing changed
        if: steps.sync.outputs.changed != 'true'
        run: echo "No mod changes; exiting."

      - name: Build password-protected zip
        if: steps.sync.outputs.changed == 'true'
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          # -mx=1: jars are already deflated; compression buys nothing.
          7z a -tzip -mx=1 -mem=ZipCrypto -p"$ZIP_PASSWORD" \
            mods-latest.zip ./mods/*.jar >/dev/null
          # Ships beside the mods so it lands in the same extracted folder the
          # player is already looking at. Encrypted like everything else, or
          # File Explorer would prompt for the password twice.
          if [ -f remove-mods.txt ]; then
            7z a -tzip -mx=1 -mem=ZipCrypto -p"$ZIP_PASSWORD" \
              mods-latest.zip remove-mods.txt >/dev/null
          fi
          ls -lh mods-latest.zip

      # What digbuild-sync reads, and deliberately not gated on a mod having
      # changed: the client checks on every launch, so the manifest has to be
      # there and current even on a run that publishes no release. Uploads only
      # the jars whose contents are new to the mod-store release.
      - name: Publish the client manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_manifest.py

      - name: Publish release
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mods-$(date -u +%Y%m%d-%H%M%S)"
          # A copy of the manifest rides the release as a record of exactly
          # what this one contained. The client reads the mod-store copy; this
          # is not the authoritative one.
          gh release create "$TAG" \
            --title "Mods $(date -u +%Y-%m-%d\ %H:%M) UTC" \
            --notes-file CHANGES.md \
            mods-latest.zip mods-manifest.tsv

      # Ungated, because the sync step now fills a cold mirror even on a run
      # that publishes nothing -- and leaving that unsaved means re-pulling
      # 466MB off the game server on the next one. Re-saving an existing key is
      # a warning, not a failure.
      - name: Save mod mirror
        uses: actions/cache/save@v4
        with:
          path: mods
          key: mods-${{ hashFiles('manifest.json') }}

      - name: Commit manifest
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A so a removal that empties the list stages the delete too.
          git add -A manifest.json remove-mods.txt
          git commit -m "mods: ${{ steps.sync.outputs.count }} jars" || exit 0
          git push

      # 466MB per release adds up. Keep the most recent few.
      - name: Prune old releases
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # mod-store is not a release in this sense -- it is the jar store the
          # in-game updater fetches from, and deleting it breaks every client.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -v '^mod-store$' \
            | tail -n +6 \
            | xargs -r -n1 gh release delete --yes --cleanup-tag
